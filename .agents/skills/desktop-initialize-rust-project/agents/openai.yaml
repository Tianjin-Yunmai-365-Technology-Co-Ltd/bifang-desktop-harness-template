interface:
  display_name: "初始化 Rust 项目"
  short_description: "建立中性 Rust 脚手架及三选一 Logo 的 GUI 基线"
  default_prompt: "使用 $desktop-initialize-rust-project 选择接口和策略并建立 core-first、薄 adapter 的中性 Rust 脚手架；选择 GUI 时生成并选择 3 个 Logo，建立托盘、图标/Tooltip 完整且默认收起的 Logo→版本侧栏、三态主题设置、应用级亮暗主题、含更新入口的关于页、双主题赞助页和 1440×900 主窗口，再裁剪初始化能力。"
