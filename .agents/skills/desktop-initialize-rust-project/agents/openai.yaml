interface:
  display_name: "初始化 Rust 项目"
  short_description: "建立可选择 GUI 生命周期、支持页与侧栏模式的中性 Rust 基线"
  default_prompt: "使用 $desktop-initialize-rust-project 选择接口和策略并建立 core-first、薄 adapter 的中性 Rust 脚手架；选择 GUI 后专门询问托盘、关于页、赞助页、单实例与侧栏模式，四项能力必须明确，侧栏未选时写入 detailed，生成并选择 3 个 Logo，按最终 profile 建立启用能力并排除禁用能力，完成结构检查和适用的真实宿主 E2E，再裁剪初始化能力。"
