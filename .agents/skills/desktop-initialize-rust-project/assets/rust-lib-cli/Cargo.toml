[workspace]
members = ["example_tool_core", "example_tool_cli"]
resolver = "3"

[workspace.metadata.agent-first-harness]
target-platforms = []
interfaces = []

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
assert_cmd = "2.2.2"
clap = { version = "4.6.7", features = ["derive"] }
example_tool_core = { path = "example_tool_core" }
jiff = "0.2.38"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt"] }
