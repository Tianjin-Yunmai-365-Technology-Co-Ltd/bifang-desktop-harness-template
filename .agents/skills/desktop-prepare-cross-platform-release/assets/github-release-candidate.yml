name: release-candidate

on:
  workflow_dispatch:
    inputs:
      confirm_candidate_build:
        description: "我确认这是已授权的原生候选构建"
        required: true
        type: boolean
        default: false
      version:
        description: "已批准且不含 v 前缀的 Cargo 版本"
        required: true
        type: string
      source_commit:
        description: "已批准的 40 字符源码提交 SHA"
        required: true
        type: string
      release_context_sha256:
        description: "调用方验证的 .harness/release-context.json SHA-256"
        required: true
        type: string
      e2e_selection:
        description: "当前候选构建完成后是否启用 E2E"
        required: true
        type: choice
        options:
          - disabled
          - enabled
        default: disabled

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PRODUCT_NAME: example-tool
      VERSION: ${{ inputs.version }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_CONTEXT_SHA256: ${{ inputs.release_context_sha256 }}
      E2E_SELECTION: ${{ inputs.e2e_selection }}
      REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RELEASE_CONTEXT_SNAPSHOT: ${{ runner.temp }}/release-context-snapshot.json
      BUILD_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_TARGET_DIR: target
    steps:
      - name: 确认已授权候选预检
        shell: bash
        run: |
          if [[ "${{ inputs.confirm_candidate_build }}" != "true" ]]; then
            echo "尚未确认候选构建"
            echo "::error::运行此工作流前请设置 confirm_candidate_build=true。"
            exit 1
          fi
          if [[ "$E2E_SELECTION" != "enabled" && "$E2E_SELECTION" != "disabled" ]]; then
            echo "::error::e2e_selection 必须是 enabled 或 disabled。"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          check-latest: false
      - name: 验证 Node.js 运行时
        shell: bash
        run: node .agents/skills/desktop-prepare-cross-platform-release/scripts/release_candidate_workflow.mjs check-node-runtime
      - name: 验证已检出源码
        shell: bash
        run: node .agents/skills/desktop-prepare-cross-platform-release/scripts/release_candidate_workflow.mjs verify-checkout
      - name: 捕获已发布上下文
        shell: bash
        run: |
          node .agents/skills/desktop-prepare-cross-platform-release/scripts/verify_release_context.mjs capture \
            --project-root "$GITHUB_WORKSPACE" \
            --source-commit "$SOURCE_COMMIT" \
            --expected-context-sha256 "$RELEASE_CONTEXT_SHA256" \
            --repository-default-branch "$REPOSITORY_DEFAULT_BRANCH" \
            --snapshot "$RELEASE_CONTEXT_SNAPSHOT"
      - name: 读取项目最低 Rust 版本
        shell: bash
        run: node .agents/skills/desktop-prepare-cross-platform-release/scripts/release_candidate_workflow.mjs read-msrv
      - name: 选择项目 MSRV
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - name: 验证候选版本
        shell: bash
        run: node .agents/skills/desktop-prepare-cross-platform-release/scripts/release_candidate_workflow.mjs verify-version
      - name: 验证发布更新日志
        shell: bash
        run: |
          node .agents/skills/desktop-prepare-release/scripts/release_notes.mjs check --file release-notes.json --expected-version "$VERSION"
          node .agents/skills/desktop-prepare-cross-platform-release/scripts/release_candidate_workflow.mjs hash-release-notes
      - name: 准备 Unix 发布目录
        if: runner.os != 'Windows' && success()
        shell: bash
        run: bash .agents/skills/desktop-build-rust-release/scripts/prepare-release-directory.sh "$GITHUB_WORKSPACE"
      - name: 准备 Windows 发布目录
        if: runner.os == 'Windows' && success()
        shell: pwsh
        run: '& ".agents/skills/desktop-build-rust-release/scripts/prepare-release-directory.ps1" -ProjectRoot $env:GITHUB_WORKSPACE'
      - name: 验证候选
        shell: bash
        run: |
          node .agents/skills/desktop-prepare-cross-platform-release/scripts/release_candidate_workflow.mjs list-tests
          cargo test --workspace --all-targets --all-features --locked
          node .agents/skills/desktop-prepare-cross-platform-release/scripts/release_candidate_workflow.mjs verify-post-test
          cargo build --workspace --release --locked
      - name: 尝试 Unix 签名
        if: runner.os != 'Windows' && success()
        shell: bash
        run: |
          set -euo pipefail
          binary="target/release/${PRODUCT_NAME}"
          hook=".release-signing/sign-candidate.sh"
          status="unsigned"
          reason="hook-not-configured"
          evidence="not-applicable"
          if [[ -f "$hook" ]]; then
            set +e
            bash "$hook" probe "$binary" >/dev/null 2>&1
            probe_status=$?
            set -e
            if [[ $probe_status -eq 0 ]]; then
              if ! bash "$hook" sign "$binary" >/dev/null 2>&1; then
                echo "::error::已配置的签名尝试失败"
                exit 1
              fi
              if ! bash "$hook" verify "$binary" >/dev/null 2>&1; then
                echo "::error::已签名候选验证失败"
                exit 1
              fi
              status="signed"
              reason="configured-hook-succeeded"
              evidence="configured-hook-verify-exit-0"
            elif [[ $probe_status -eq 3 ]]; then
              reason="signing-conditions-unavailable"
            else
              echo "::error::签名探测失败，退出码为 $probe_status"
              exit 1
            fi
          fi
          printf 'SIGNING_STATUS=%s\nSIGNING_REASON=%s\nSIGNING_EVIDENCE=%s\n' "$status" "$reason" "$evidence" >> "$GITHUB_ENV"
      - name: 尝试 Windows 签名
        if: runner.os == 'Windows' && success()
        shell: pwsh
        run: |
          $binary = "target/release/$env:PRODUCT_NAME.exe"
          $hook = ".release-signing/sign-candidate.ps1"
          $status = "unsigned"
          $reason = "hook-not-configured"
          $evidence = "not-applicable"
          if (Test-Path -LiteralPath $hook -PathType Leaf) {
            & pwsh -NoProfile -File $hook probe $binary *> $null
            $probeStatus = $LASTEXITCODE
            if ($probeStatus -eq 0) {
              & pwsh -NoProfile -File $hook sign $binary *> $null
              if ($LASTEXITCODE -ne 0) { throw "已配置的签名尝试失败" }
              & pwsh -NoProfile -File $hook verify $binary *> $null
              if ($LASTEXITCODE -ne 0) { throw "已签名候选验证失败" }
              $status = "signed"
              $reason = "configured-hook-succeeded"
              $evidence = "configured-hook-verify-exit-0"
            } elseif ($probeStatus -eq 3) {
              $reason = "signing-conditions-unavailable"
            } else {
              throw "签名探测失败，退出码为 $probeStatus"
            }
          }
          "SIGNING_STATUS=$status" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNING_REASON=$reason" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNING_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 打包 Unix 候选
        id: package_unix
        if: runner.os != 'Windows' && success()
        shell: bash
        run: |
          set -euo pipefail
          binary="target/release/${PRODUCT_NAME}"
          test -f "$binary"
          platform="$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          archive="${PRODUCT_NAME}-v${VERSION}-${platform}-${arch}.tar.gz"
          stage="$(mktemp -d "${GITHUB_WORKSPACE}/../.${PRODUCT_NAME}.release-candidate.XXXXXX")"
          chmod 700 "$stage"
          tar -czf "${stage}/${archive}" -C target/release "$PRODUCT_NAME" -C "$GITHUB_WORKSPACE" release-notes.json
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$stage" && sha256sum "$archive" > "${archive}.sha256")
          else
            (cd "$stage" && shasum -a 256 "$archive" > "${archive}.sha256")
          fi
          printf 'archive_name=%s\nstage_path=%s\n' "$archive" "$stage" >> "$GITHUB_OUTPUT"
      - name: 打包 Windows 候选
        id: package_windows
        if: runner.os == 'Windows' && success()
        shell: pwsh
        run: |
          $binary = "target/release/$env:PRODUCT_NAME.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "缺少发布二进制文件：$binary" }
          $platform = $env:RUNNER_OS.ToLowerInvariant()
          $arch = $env:RUNNER_ARCH.ToLowerInvariant()
          $archive = "$env:PRODUCT_NAME-v$env:VERSION-$platform-$arch.zip"
          $stage = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) (".$env:PRODUCT_NAME.release-candidate." + [Guid]::NewGuid().ToString("N"))
          [IO.Directory]::CreateDirectory($stage) | Out-Null
          Compress-Archive -LiteralPath @($binary, "release-notes.json") -DestinationPath (Join-Path $stage $archive)
          $hash = (Get-FileHash (Join-Path $stage $archive) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content (Join-Path $stage "$archive.sha256") -Encoding ascii
          "archive_name=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "stage_path=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: 解析候选制品
        id: candidate_artifact
        shell: bash
        env:
          UNIX_ARCHIVE: ${{ steps.package_unix.outputs.archive_name }}
          WINDOWS_ARCHIVE: ${{ steps.package_windows.outputs.archive_name }}
          UNIX_STAGE: ${{ steps.package_unix.outputs.stage_path }}
          WINDOWS_STAGE: ${{ steps.package_windows.outputs.stage_path }}
        run: node .agents/skills/desktop-prepare-cross-platform-release/scripts/release_candidate_workflow.mjs resolve-artifact
      - name: 记录候选清单
        shell: bash
        env:
          CANDIDATE_ARCHIVE: ${{ steps.candidate_artifact.outputs.archive_name }}
          CANDIDATE_STAGE: ${{ steps.candidate_artifact.outputs.stage_path }}
        run: |
          node .agents/skills/desktop-prepare-cross-platform-release/scripts/verify_release_context.mjs verify \
            --project-root "$GITHUB_WORKSPACE" \
            --source-commit "$SOURCE_COMMIT" \
            --expected-context-sha256 "$RELEASE_CONTEXT_SHA256" \
            --repository-default-branch "$REPOSITORY_DEFAULT_BRANCH" \
            --snapshot "$RELEASE_CONTEXT_SNAPSHOT"
          node .agents/skills/desktop-prepare-cross-platform-release/scripts/release_candidate_workflow.mjs write-manifest
      - name: 提交候选制品集合
        shell: bash
        env:
          CANDIDATE_ARCHIVE: ${{ steps.candidate_artifact.outputs.archive_name }}
          CANDIDATE_STAGE: ${{ steps.candidate_artifact.outputs.stage_path }}
        run: node .agents/skills/desktop-prepare-cross-platform-release/scripts/release_candidate_workflow.mjs commit-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: ${{ runner.os }}-${{ runner.arch }}-release-candidate
          path: |
            release/${{ steps.candidate_artifact.outputs.archive_name }}
            release/${{ steps.candidate_artifact.outputs.archive_name }}.sha256
            release/${{ steps.candidate_artifact.outputs.archive_name }}.manifest.json
          if-no-files-found: error
