interface:
  display_name: "添加 GUI 适配器"
  short_description: "增加带强制单实例、系统托盘、三选一 Logo 和固定侧栏的 GUI"
  default_prompt: "使用 $desktop-add-gui-adapter，增加调用 core 用例的 Tauri/React 薄适配器，强制接入首插件单实例、第二次启动唤醒既有窗口、非透明 32px 应用图标及从 setup 可达的托盘菜单/图标/构建接线、关闭隐藏/恢复/退出生命周期，并建立三选一 Logo、图标/Tooltip 完整且默认收起的 Logo→版本侧栏、三态主题设置、应用级亮暗主题、含更新入口的关于页和双主题赞助页；平台业务效果回到 core。"
